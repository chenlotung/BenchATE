[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ate-workbench"
version = "0.1.0"
description = "Windows laboratory instrument connection, monitoring and output control"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "pyqtgraph>=0.13.7,<0.15", "PyVISA>=1.15,<2", "pyvisa-py>=0.8.1,<0.9", "PyUSB>=1.3,<2", "libusb-package>=1.0.30,<2", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pypdf>=5,<7"]
build = ["pyinstaller>=6.12,<7", "reportlab>=4,<5", "markdown-it-py>=3,<5", "pypdf>=5,<7"]

[project.scripts]
ate-workbench = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["."]
